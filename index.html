<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griha Pravesh Invitation</title>
    <!-- Google Fonts for elegant typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-primary: #5A2B68;
            --purple-medium: #7B4B8A;
            --purple-light: #9D6BB0;
            --lavender-soft: #D5C2E2;
            --gold-primary: #C5A059;
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            --stone-base: #EDE6DD;
            --stone-shadow: #D1C5B7;
            --cream-bg: #FAF7F2;
            --text-dark: #4A2E4B;
            --leaf-green: #526E5B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2D232E;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Outer Invitation Card Frame */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 540px;
            background: var(--cream-bg);
            border-radius: 4px;
            padding: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            /* Gold Frame Outer Border */
            background-image: var(--gold-gradient);
        }

        .card-inner {
            position: relative;
            background: #FFFFFF;
            background-image: radial-gradient(#F3EEE7 1px, transparent 1px), radial-gradient(#F3EEE7 1px, #FAF7F2 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border: 2px solid rgba(197, 160, 89, 0.4);
            padding: 45px 30px 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
            min-height: 760px;
        }

        /* Classical Stone Arch & Columns Background Layer */
        .arch-columns-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Top Hanging Wisteria Garland Layer */
        .wisteria-garland {
            position: absolute;
            top: -5px;
            left: 0;
            width: 100%;
            height: 180px;
            pointer-events: none;
            z-index: 3;
        }

        /* Bottom Floral Accents Layer */
        .bottom-florals {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 190px;
            pointer-events: none;
            z-index: 3;
        }

        /* Main Content Container */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 55px;
        }

        /* Arched Invitation Header */
        .invitation-for {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--purple-medium);
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* Lord Ganesha Icon */
        .ganesha-icon {
            width: 70px;
            height: 75px;
            margin: 8px 0 16px 0;
            fill: var(--purple-primary);
            filter: drop-shadow(0px 2px 3px rgba(123, 75, 138, 0.2));
        }

        /* Main Title - Griha Pravesh */
        .title-main {
            font-family: 'Alex Brush', cursive;
            font-size: 58px;
            color: var(--purple-primary);
            line-height: 1.1;
            margin-bottom: 4px;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8);
        }

        /* Subtitle */
        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-style: italic;
            color: #7A6B7C;
            letter-spacing: 1px;
            margin-bottom: 28px;
        }

        /* Date Section */
        .event-date {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 600;
            color: var(--purple-primary);
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        /* Day & Time */
        .event-time {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-weight: 500;
            color: var(--purple-medium);
            margin-bottom: 24px;
        }

        /* Separator Line */
        .divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            margin: 10px 0 20px 0;
        }

        /* Location & RSVP */
        .event-location {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: var(--text-dark);
            line-height: 1.7;
            letter-spacing: 0.8px;
            margin-bottom: 18px;
            max-width: 80%;
        }

        .rsvp {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--purple-primary);
            letter-spacing: 1.5px;
            margin-top: 5px;
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .card-inner {
                padding: 35px 20px;
                min-height: 680px;
            }
            .title-main {
                font-size: 46px;
            }
            .event-date {
                font-size: 22px;
            }
            .content {
                margin-top: 45px;
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card-inner">

            <!-- Background Architectural Arch & Ionic Columns SVG -->
            <svg class="arch-columns-bg" viewBox="0 0 500 750" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#E5DCD2"/>
                        <stop offset="30%" stop-color="#F7F3EE"/>
                        <stop offset="70%" stop-color="#E2D7CB"/>
                        <stop offset="100%" stop-color="#D1C3B3"/>
                    </linearGradient>
                    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#E8DDD0"/>
                        <stop offset="100%" stop-color="#FAF7F2"/>
                    </linearGradient>
                </defs>

                <!-- Left Column Base & Shaft -->
                <rect x="25" y="140" width="45" height="580" fill="url(#stoneGrad)" rx="2"/>
                <!-- Fluting lines on Left Column -->
                <line x1="33" y1="180" x2="33" y2="700" stroke="#C3B4A3" stroke-width="2" stroke-dasharray="8 4"/>
                <line x1="47" y1="180" x2="47" y2="700" stroke="#FFFFFF" stroke-width="2"/>
                <line x1="61" y1="180" x2="61" y2="700" stroke="#C3B4A3" stroke-width="2" stroke-dasharray="8 4"/>
                <!-- Left Capital Scrolls -->
                <path d="M 15 140 Q 20 120 47 125 Q 75 120 80 140 Z" fill="#D9CBB9" stroke="#BBAA96"/>
                <circle cx="23" cy="133" r="7" fill="#CBBBA7"/>
                <circle cx="72" cy="133" r="7" fill="#CBBBA7"/>

                <!-- Right Column Base & Shaft -->
                <rect x="430" y="140" width="45" height="580" fill="url(#stoneGrad)" rx="2"/>
                <!-- Fluting lines on Right Column -->
                <line x1="438" y1="180" x2="438" y2="700" stroke="#C3B4A3" stroke-width="2" stroke-dasharray="8 4"/>
                <line x1="452" y1="180" x2="452" y2="700" stroke="#FFFFFF" stroke-width="2"/>
                <line x1="466" y1="180" x2="466" y2="700" stroke="#C3B4A3" stroke-width="2" stroke-dasharray="8 4"/>
                <!-- Right Capital Scrolls -->
                <path d="M 420 140 Q 425 120 452 125 Q 480 120 485 140 Z" fill="#D9CBB9" stroke="#BBAA96"/>
                <circle cx="428" cy="133" r="7" fill="#CBBBA7"/>
                <circle cx="477" cy="133" r="7" fill="#CBBBA7"/>

                <!-- Grand Top Archway -->
                <path d="M 25 140 A 225 160 0 0 1 475 140" fill="none" stroke="url(#stoneGrad)" stroke-width="28"/>
                <path d="M 39 140 A 211 146 0 0 1 461 140" fill="none" stroke="#FAF7F2" stroke-width="4"/>
                <path d="M 11 126 A 239 174 0 0 1 489 126" fill="none" stroke="#C2B29F" stroke-width="3"/>
            </svg>

            <!-- Hanging Wisteria Floral Garland SVG (Top) -->
            <svg class="wisteria-garland" viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg">
                <g opacity="0.95">
                    <!-- Vine Stems & Leaves -->
                    <path d="M 0 10 Q 120 30 250 15 Q 380 30 500 5" fill="none" stroke="#3D5A45" stroke-width="4"/>
                    <path d="M 30 15 Q 150 45 270 25 T 480 20" fill="none" stroke="#526E5B" stroke-width="2.5"/>

                    <!-- Wisteria Petal Clusters (Left, Center, Right) -->
                    <!-- Cluster 1 (Left) -->
                    <g transform="translate(40, 15)">
                        <path d="M0,0 Q-5,25 0,50 Q-3,75 0,100" fill="none" stroke="#6B3A72" stroke-width="1.5"/>
                        <ellipse cx="-2" cy="15" rx="7" ry="5" fill="#7B4B8A"/>
                        <ellipse cx="4" cy="25" rx="8" ry="6" fill="#9D6BB0"/>
                        <ellipse cx="-4" cy="40" rx="7" ry="6" fill="#B389C5"/>
                        <ellipse cx="3" cy="55" rx="6" ry="5" fill="#C8A8D8"/>
                        <ellipse cx="-2" cy="70" rx="5" ry="4" fill="#D5C2E2"/>
                        <ellipse cx="1" cy="85" rx="4" ry="3" fill="#E7DCF0"/>
                    </g>
                    <g transform="translate(85, 20)">
                        <path d="M0,0 Q5,30 0,65 Q3,90 0,120" fill="none" stroke="#5A2B68" stroke-width="1.5"/>
                        <ellipse cx="0" cy="20" rx="8" ry="6" fill="#5A2B68"/>
                        <ellipse cx="-5" cy="35" rx="9" ry="7" fill="#7B4B8A"/>
                        <ellipse cx="5" cy="55" rx="8" ry="6" fill="#9D6BB0"/>
                        <ellipse cx="-3" cy="75" rx="7" ry="5" fill="#B389C5"/>
                        <ellipse cx="3" cy="95" rx="5" ry="4" fill="#D5C2E2"/>
                        <ellipse cx="0" cy="110" rx="3" ry="3" fill="#E7DCF0"/>
                    </g>

                    <!-- Cluster 2 (Mid Left) -->
                    <g transform="translate(140, 10)">
                        <path d="M0,0 Q-4,20 0,45" fill="none" stroke="#5A2B68" stroke-width="1"/>
                        <ellipse cx="0" cy="15" rx="7" ry="5" fill="#7B4B8A"/>
                        <ellipse cx="3" cy="28" rx="6" ry="5" fill="#9D6BB0"/>
                        <ellipse cx="-2" cy="40" rx="4" ry="3" fill="#C8A8D8"/>
                    </g>
                    <g transform="translate(180, 25)">
                        <ellipse cx="0" cy="15" rx="8" ry="6" fill="#6B3A72"/>
                        <ellipse cx="-4" cy="30" rx="7" ry="6" fill="#8E5A9D"/>
                        <ellipse cx="4" cy="48" rx="6" ry="5" fill="#B389C5"/>
                        <ellipse cx="-2" cy="65" rx="5" ry="4" fill="#D5C2E2"/>
                    </g>

                    <!-- Cluster 3 (Center Arch Canopy) -->
                    <g transform="translate(245, 12)">
                        <ellipse cx="0" cy="18" rx="9" ry="7" fill="#5A2B68"/>
                        <ellipse cx="5" cy="35" rx="8" ry="6" fill="#7B4B8A"/>
                        <ellipse cx="-5" cy="52" rx="8" ry="6" fill="#9D6BB0"/>
                        <ellipse cx="3" cy="70" rx="7" ry="5" fill="#B389C5"/>
                        <ellipse cx="-2" cy="88" rx="5" ry="4" fill="#C8A8D8"/>
                        <ellipse cx="0" cy="102" rx="4" ry="3" fill="#E7DCF0"/>
                    </g>

                    <!-- Cluster 4 (Mid Right) -->
                    <g transform="translate(315, 20)">
                        <ellipse cx="0" cy="15" rx="8" ry="6" fill="#6B3A72"/>
                        <ellipse cx="4" cy="32" rx="7" ry="6" fill="#8E5A9D"/>
                        <ellipse cx="-3" cy="50" rx="6" ry="5" fill="#B389C5"/>
                        <ellipse cx="1" cy="68" rx="4" ry="4" fill="#D5C2E2"/>
                    </g>
                    <g transform="translate(365, 12)">
                        <ellipse cx="0" cy="15" rx="7" ry="5" fill="#7B4B8A"/>
                        <ellipse cx="-3" cy="28" rx="6" ry="5" fill="#9D6BB0"/>
                        <ellipse cx="2" cy="42" rx="4" ry="3" fill="#C8A8D8"/>
                    </g>

                    <!-- Cluster 5 (Right) -->
                    <g transform="translate(415, 18)">
                        <ellipse cx="0" cy="20" rx="9" ry="7" fill="#5A2B68"/>
                        <ellipse cx="5" cy="38" rx="8" ry="6" fill="#7B4B8A"/>
                        <ellipse cx="-4" cy="58" rx="8" ry="6" fill="#9D6BB0"/>
                        <ellipse cx="3" cy="78" rx="7" ry="5" fill="#B389C5"/>
                        <ellipse cx="-2" cy="98" rx="5" ry="4" fill="#D5C2E2"/>
                        <ellipse cx="0" cy="112" rx="3" ry="3" fill="#E7DCF0"/>
                    </g>
                    <g transform="translate(460, 15)">
                        <ellipse cx="-2" cy="15" rx="7" ry="5" fill="#7B4B8A"/>
                        <ellipse cx="4" cy="28" rx="8" ry="6" fill="#9D6BB0"/>
                        <ellipse cx="-3" cy="42" rx="6" ry="5" fill="#B389C5"/>
                        <ellipse cx="2" cy="58" rx="5" ry="4" fill="#C8A8D8"/>
                    </g>
                </g>
            </svg>

            <!-- Card Inner Text Content -->
            <div class="content">
                <div class="invitation-for">Rahul & Simran invite you to the</div>

                <!-- Lord Ganesha SVG Illustration -->
                <svg class="ganesha-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Crown / Mukut -->
                    <path d="M50 10 L58 28 L42 28 Z" fill="var(--purple-primary)"/>
                    <path d="M44 28 C44 20, 56 20, 56 28 Z" fill="var(--gold-primary)"/>
                    <circle cx="50" cy="18" r="2.5" fill="#FFFFFF"/>
                    
                    <!-- Ears -->
                    <path d="M42 35 C20 28, 18 52, 38 52" fill="none" stroke="var(--purple-primary)" stroke-width="3" stroke-linecap="round"/>
                    <path d="M58 35 C80 28, 82 52, 62 52" fill="none" stroke="var(--purple-primary)" stroke-width="3" stroke-linecap="round"/>
                    
                    <!-- Head & Trunk -->
                    <path d="M38 38 C38 30, 62 30, 62 38 C62 50, 54 50, 54 62 C54 70, 62 70, 62 64 C62 60, 57 60, 57 64" fill="none" stroke="var(--purple-primary)" stroke-width="3.5" stroke-linecap="round"/>
                    
                    <!-- Tilak -->
                    <path d="M46 32 L54 32 M47 35 L53 35 M50 31 L50 38" stroke="var(--gold-primary)" stroke-width="1.8"/>
                    
                    <!-- Seated Body Base -->
                    <path d="M28 72 C28 62, 40 60, 50 60 C60 60, 72 62, 72 72 C72 80, 28 80, 28 72 Z" fill="none" stroke="var(--purple-primary)" stroke-width="3"/>
                    <circle cx="50" cy="71" r="3" fill="var(--gold-primary)"/>
                </svg>

                <h1 class="title-main">Griha Pravesh</h1>
                <div class="subtitle">of their new home</div>

                <div class="event-date">24 April, 2030</div>
                <div class="event-time">Sunday, 11:00 AM</div>

                <div class="divider"></div>

                <div class="event-location">
                    428 Anywhere St., Any City, ST 12345
                </div>

                <div class="rsvp">RSVP at +123-456-7890</div>
            </div>

            <!-- Bottom Floral Accents SVG (Roses & Leaves) -->
            <svg class="bottom-florals" viewBox="0 0 500 190" xmlns="http://www.w3.org/2000/svg">
                <!-- Left Bottom Floral Cluster -->
                <g transform="translate(0, 40)">
                    <!-- Eucalyptus Leaves -->
                    <path d="M 10 130 Q 50 80 110 90" fill="none" stroke="#526E5B" stroke-width="3"/>
                    <ellipse cx="40" cy="110" rx="14" ry="8" fill="#728F7B" transform="rotate(-30 40 110)"/>
                    <ellipse cx="70" cy="95" rx="15" ry="9" fill="#526E5B" transform="rotate(-15 70 95)"/>
                    <ellipse cx="95" cy="90" rx="13" ry="7" fill="#88A491" transform="rotate(10 95 90)"/>
                    
                    <!-- White Rose Flower -->
                    <g transform="translate(60, 110)">
                        <circle cx="0" cy="0" r="30" fill="#FFFDF9" stroke="#E8DFD3" stroke-width="1"/>
                        <path d="M -12 -5 C -5 -18, 12 -18, 15 -3 C 20 10, -5 20, -12 -5 Z" fill="#F8F2E8"/>
                        <path d="M -6 -2 C -2 -10, 8 -10, 8 -1 C 10 6, -3 10, -6 -2 Z" fill="#EFE4D2"/>
                        <circle cx="1" cy="1" r="4" fill="#E5D3B9"/>
                    </g>
                    <!-- Accent Petals -->
                    <circle cx="20" cy="135" r="18" fill="#FAF5ED"/>
                    <circle cx="105" cy="125" r="16" fill="#FFFDF9"/>
                </g>

                <!-- Right Bottom Floral Cluster -->
                <g transform="translate(500, 40) scale(-1, 1)">
                    <!-- Eucalyptus Leaves -->
                    <path d="M 10 130 Q 50 80 110 90" fill="none" stroke="#526E5B" stroke-width="3"/>
                    <ellipse cx="40" cy="110" rx="14" ry="8" fill="#728F7B" transform="rotate(-30 40 110)"/>
                    <ellipse cx="70" cy="95" rx="15" ry="9" fill="#526E5B" transform="rotate(-15 70 95)"/>
                    <ellipse cx="95" cy="90" rx="13" ry="7" fill="#88A491" transform="rotate(10 95 90)"/>
                    
                    <!-- White Rose Flower -->
                    <g transform="translate(60, 110)">
                        <circle cx="0" cy="0" r="30" fill="#FFFDF9" stroke="#E8DFD3" stroke-width="1"/>
                        <path d="M -12 -5 C -5 -18, 12 -18, 15 -3 C 20 10, -5 20, -12 -5 Z" fill="#F8F2E8"/>
                        <path d="M -6 -2 C -2 -10, 8 -10, 8 -1 C 10 6, -3 10, -6 -2 Z" fill="#EFE4D2"/>
                        <circle cx="1" cy="1" r="4" fill="#E5D3B9"/>
                    </g>
                    <!-- Accent Petals -->
                    <circle cx="20" cy="135" r="18" fill="#FAF5ED"/>
                    <circle cx="105" cy="125" r="16" fill="#FFFDF9"/>
                </g>
            </svg>

        </div>
    </div>

</body>
</html>
