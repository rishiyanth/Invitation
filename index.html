<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griha Pravesh Invitation | Housewarming Ceremony</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #FFF8EE;
            --bg-accent: #FFF0DB;
            --primary-magenta: #9E0043;
            --deep-magenta: #70002F;
            --gold-accent: #D4AF37;
            --gold-light: #F3E5AB;
            --lotus-pink: #FF80AB;
            --lotus-soft: #F8BBD0;
            --stem-green: #4CAF50;
            --text-dark: #330015;
            --shadow: 0 15px 35px rgba(158, 0, 67, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2D0014;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas for Floating Lotus Petals Animation */
        #petal-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        /* Main Invitation Card Container */
        .card-container {
            background-color: var(--bg-cream);
            width: 100%;
            max-width: 650px;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 2;
            animation: cardAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Outer & Inner Frame Borders */
        .card-frame {
            border: 4px solid var(--primary-magenta);
            border-radius: 8px;
            padding: 35px 25px 40px 25px;
            position: relative;
            background: radial-gradient(circle at center, var(--bg-cream) 60%, var(--bg-accent) 100%);
            overflow: hidden;
            text-align: center;
        }

        .card-frame::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1.5px solid var(--gold-accent);
            border-radius: 4px;
            pointer-events: none;
        }

        /* Background Floral Watermark Pattern */
        .bg-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110%;
            height: 110%;
            opacity: 0.06;
            background-image: radial-gradient(var(--primary-magenta) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .flower-pattern-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.3);
            opacity: 0.07;
            width: 100%;
            pointer-events: none;
        }

        /* Om Symbol Header */
        .om-container {
            margin-bottom: 12px;
            position: relative;
            display: inline-block;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .om-symbol {
            font-size: 52px;
            color: var(--primary-magenta);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(158, 0, 67, 0.2);
        }

        /* Typography Styles */
        .invited-text {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: var(--primary-magenta);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .main-heading {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            font-weight: 800;
            color: var(--primary-magenta);
            letter-spacing: 2px;
            line-height: 1.25;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .sub-heading {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--primary-magenta);
            letter-spacing: 1.5px;
            margin-bottom: 14px;
        }

        .home-text {
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: var(--primary-magenta);
            margin-bottom: 18px;
        }

        /* Gold Divider Line */
        .divider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px auto 22px auto;
            max-width: 80%;
        }

        .divider-line {
            height: 1.5px;
            flex: 1;
            background: linear-gradient(to right, transparent, var(--primary-magenta), transparent);
        }

        .divider-diamond {
            width: 10px;
            height: 10px;
            background-color: var(--primary-magenta);
            transform: rotate(45deg);
            border: 1px solid var(--gold-accent);
        }

        /* Date Section Badge */
        .date-section {
            margin: 20px 0;
            display: inline-block;
            width: 100%;
            max-width: 480px;
        }

        .month-header {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-magenta);
            letter-spacing: 6px;
            margin-bottom: 8px;
        }

        .date-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-top: 1.5px solid var(--primary-magenta);
            border-bottom: 1.5px solid var(--primary-magenta);
            padding: 10px 0;
            margin: 0 auto;
        }

        .day-name, .time-text {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-magenta);
            letter-spacing: 2px;
            flex: 1;
        }

        .day-name { text-align: right; }
        .time-text { text-align: left; }

        .date-number {
            font-family: 'Cinzel', serif;
            font-size: 54px;
            font-weight: 800;
            color: var(--primary-magenta);
            line-height: 0.9;
            padding: 0 15px;
            border-left: 1px solid rgba(158, 0, 67, 0.3);
            border-right: 1px solid rgba(158, 0, 67, 0.3);
        }

        .year-text {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-magenta);
            letter-spacing: 8px;
            margin-top: 8px;
        }

        .at-text {
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: var(--primary-magenta);
            margin: 15px 0 8px 0;
        }

        /* Venue Address */
        .address-box {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-magenta);
            letter-spacing: 1px;
            line-height: 1.6;
            margin-bottom: 22px;
            padding: 0 20px;
        }

        /* Countdown Timer */
        .countdown-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-magenta);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .count-box {
            background: rgba(158, 0, 67, 0.05);
            border: 1px solid rgba(158, 0, 67, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            min-width: 65px;
        }

        .count-number {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-magenta);
        }

        .count-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dark);
            opacity: 0.8;
            margin-top: 2px;
        }

        /* RSVP & Action Buttons */
        .rsvp-section {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-magenta);
            letter-spacing: 1px;
            margin-bottom: 20px;
            position: relative;
            z-index: 5;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 5;
        }

        .btn {
            background-color: var(--primary-magenta);
            color: #FFF;
            border: 1px solid var(--gold-accent);
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(158, 0, 67, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--deep-magenta);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(158, 0, 67, 0.35);
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            color: #FFF;
            border: 1px solid #FFF8EE;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #E5C158 0%, #C2921C 100%);
        }

        /* SVG Lotus Corner Illustrations */
        .lotus-corner {
            position: absolute;
            bottom: -10px;
            width: 170px;
            height: auto;
            pointer-events: none;
            z-index: 3;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            transition: transform 0.5s ease;
        }

        .lotus-left {
            left: -15px;
            animation: swayLeft 6s ease-in-out infinite alternate;
        }

        .lotus-right {
            right: -15px;
            transform: scaleX(-1);
            animation: swayRight 6s ease-in-out infinite alternate;
        }

        /* Modal Popup for RSVP */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: var(--bg-cream);
            border: 2px solid var(--primary-magenta);
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            padding: 25px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-close {
            position: absolute;
            top: 12px; right: 15px;
            font-size: 22px;
            color: var(--primary-magenta);
            cursor: pointer;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-magenta);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(158, 0, 67, 0.3);
            border-radius: 6px;
            background-color: #FFF;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--text-dark);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-magenta);
            box-shadow: 0 0 0 2px rgba(158, 0, 67, 0.15);
        }

        /* Animations */
        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(158, 0, 67, 0.5)); }
        }

        @keyframes swayLeft {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(3deg); }
        }

        @keyframes swayRight {
            0% { transform: scaleX(-1) rotate(0deg); }
            100% { transform: scaleX(-1) rotate(3deg); }
        }

        @keyframes modalSlide {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Layout Adjustments */
        @media (max-width: 520px) {
            .card-frame { padding: 25px 15px 35px 15px; }
            .main-heading { font-size: 26px; }
            .sub-heading { font-size: 22px; }
            .invited-text, .home-text, .at-text { font-size: 22px; }
            .date-number { font-size: 42px; }
            .day-name, .time-text { font-size: 14px; }
            .address-box { font-size: 13px; padding: 0 5px; }
            .lotus-corner { width: 120px; }
            .count-box { min-width: 50px; padding: 6px 8px; }
            .count-number { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- Particle Canvas for Falling Lotus Petals -->
    <canvas id="petal-canvas"></canvas>

    <!-- Main Card Container -->
    <div class="card-container">
        <div class="card-frame">
            
            <!-- Watermark Pattern -->
            <div class="bg-watermark"></div>
            <svg class="flower-pattern-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path fill="#9E0043" d="M100,15 C105,40 120,55 145,60 C120,65 105,80 100,105 C95,80 80,65 55,60 C80,55 95,40 100,15 Z"/>
                <circle cx="100" cy="60" r="40" fill="none" stroke="#9E0043" stroke-width="1"/>
            </svg>

            <!-- Om Sacred Symbol -->
            <div class="om-container">
                <div class="om-symbol">🕉</div>
            </div>

            <!-- Invitation Text -->
            <div class="invited-text">You are warmly invited to the</div>
            <div class="main-heading">Griha Pravesh</div>
            <div class="sub-heading">Ceremony</div>
            <div class="home-text">of our new home on</div>

            <!-- Diamond Divider -->
            <div class="divider-container">
                <div class="divider-line"></div>
                <div class="divider-diamond"></div>
                <div class="divider-line"></div>
            </div>

            <!-- Date Block -->
            <div class="date-section">
                <div class="month-header">JULY</div>
                <div class="date-grid">
                    <div class="day-name">SUNDAY</div>
                    <div class="date-number">28</div>
                    <div class="time-text">AT 8AM</div>
                </div>
                <div class="year-text">2025</div>
            </div>

            <div class="at-text">at</div>

            <!-- Address -->
            <div class="address-box">
               S2, Ganga Enclave, Kambar Steeet<br>Gandhi Nagar, Chennai - 600093
            </div>

            <!-- Live Countdown Timer -->
            <div class="countdown-title">Ceremony Countdown</div>
            <div class="countdown-container" id="countdown">
                <div class="count-box"><div class="count-number" id="days">00</div><div class="count-label">Days</div></div>
                <div class="count-box"><div class="count-number" id="hours">00</div><div class="count-label">Hours</div></div>
                <div class="count-box"><div class="count-number" id="minutes">00</div><div class="count-label">Mins</div></div>
                <div class="count-box"><div class="count-number" id="seconds">00</div><div class="count-label">Secs</div></div>
            </div>

            <!-- RSVP Banner -->
            <div class="rsvp-section">
                RSVP : +123-456-7890
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-gold" onclick="openRsvpModal()">
                    💌 Send RSVP
                </button>
                <button class="btn" onclick="addToCalendar()">
                    📅 Calendar
                </button>
                <a href="https://maps.google.com" target="_blank" class="btn">
                    📍 Directions
                </a>
            </div>

            <!-- Bottom Left Lotus Illustration -->
            <svg class="lotus-corner lotus-left" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Stems -->
                <path d="M40 160 Q 45 110 30 80" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
                <path d="M50 160 Q 65 120 75 90" stroke="#388E3C" stroke-width="3" stroke-linecap="round"/>
                <path d="M20 160 Q 25 130 15 110" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
                <!-- Lotus Buds -->
                <path d="M15 110 C 5 100 10 85 15 80 C 20 85 25 100 15 110 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                <!-- Main Lotus Flower Left -->
                <g transform="translate(10, 30)">
                    <path d="M35 50 C 15 35 10 15 35 0 C 60 15 55 35 35 50 Z" fill="#FF80AB" stroke="#9E0043" stroke-width="1"/>
                    <path d="M35 50 C 0 30 0 10 20 10 C 30 25 35 40 35 50 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                    <path d="M35 50 C 70 30 70 10 50 10 C 40 25 35 40 35 50 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                    <path d="M35 50 C -10 40 0 25 10 20 C 25 30 30 45 35 50 Z" fill="#FFC1E3" opacity="0.9"/>
                    <path d="M35 50 C 80 40 70 25 60 20 C 45 30 40 45 35 50 Z" fill="#FFC1E3" opacity="0.9"/>
                    <!-- Yellow Anther Core -->
                    <circle cx="35" cy="30" r="5" fill="#FFEB3B"/>
                </g>
                <!-- Smaller Lotus Right -->
                <g transform="translate(55, 50) scale(0.75)">
                    <path d="M35 50 C 15 35 10 15 35 0 C 60 15 55 35 35 50 Z" fill="#FF80AB" stroke="#9E0043" stroke-width="1"/>
                    <path d="M35 50 C 0 30 0 10 20 10 C 30 25 35 40 35 50 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                    <path d="M35 50 C 70 30 70 10 50 10 C 40 25 35 40 35 50 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                    <circle cx="35" cy="30" r="4" fill="#FFEB3B"/>
                </g>
            </svg>

            <!-- Bottom Right Lotus Illustration -->
            <svg class="lotus-corner lotus-right" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Stems -->
                <path d="M40 160 Q 45 110 30 80" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
                <path d="M50 160 Q 65 120 75 90" stroke="#388E3C" stroke-width="3" stroke-linecap="round"/>
                <path d="M20 160 Q 25 130 15 110" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
                <!-- Main Lotus Flower -->
                <g transform="translate(10, 30)">
                    <path d="M35 50 C 15 35 10 15 35 0 C 60 15 55 35 35 50 Z" fill="#FF80AB" stroke="#9E0043" stroke-width="1"/>
                    <path d="M35 50 C 0 30 0 10 20 10 C 30 25 35 40 35 50 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                    <path d="M35 50 C 70 30 70 10 50 10 C 40 25 35 40 35 50 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                    <circle cx="35" cy="30" r="5" fill="#FFEB3B"/>
                </g>
                <g transform="translate(55, 50) scale(0.75)">
                    <path d="M35 50 C 15 35 10 15 35 0 C 60 15 55 35 35 50 Z" fill="#FF80AB" stroke="#9E0043" stroke-width="1"/>
                    <path d="M35 50 C 0 30 0 10 20 10 C 30 25 35 40 35 50 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                    <path d="M35 50 C 70 30 70 10 50 10 C 40 25 35 40 35 50 Z" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
                    <circle cx="35" cy="30" r="4" fill="#FFEB3B"/>
                </g>
            </svg>

        </div>
    </div>

    <!-- RSVP Interactive Modal Popup -->
    <div class="modal" id="rsvpModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeRsvpModal()">&times;</span>
            <div class="main-heading" style="font-size: 22px; margin-bottom: 15px;">Confirm RSVP</div>
            <form id="rsvpForm" onsubmit="submitRSVP(event)">
                <div class="form-group">
                    <label for="guestName">Your Full Name</label>
                    <input type="text" id="guestName" required placeholder="e.g. John & Family">
                </div>
                <div class="form-group">
                    <label for="attendance">Will you attend?</label>
                    <select id="attendance" required>
                        <option value="Joyfully Accept">Joyfully Accept</option>
                        <option value="Regretfully Decline">Regretfully Decline</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="guestCount">Number of Guests</label>
                    <input type="number" id="guestCount" min="1" max="10" value="1" required>
                </div>
                <div class="form-group">
                    <label for="message">Warm Wishes / Message</label>
                    <textarea id="message" rows="3" placeholder="Write a note for the new home..."></textarea>
                </div>
                <button type="submit" class="btn btn-gold" style="width: 100%; justify-content: center;">
                    Submit Response
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript Interactive Code -->
    <script>
        /* 1. Interactive Countdown Timer */
        const eventDate = new Date("July 28, 2025 08:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = eventDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = String(days).padStart(2, '0');
                document.getElementById("hours").innerText = String(hours).padStart(2, '0');
                document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
                document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById("countdown").innerHTML = "<div style='color: var(--primary-magenta); font-weight: bold;'>The Ceremony Has Begun!</div>";
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        /* 2. RSVP Modal Handlers */
        function openRsvpModal() {
            document.getElementById("rsvpModal").style.display = "flex";
        }

        function closeRsvpModal() {
            document.getElementById("rsvpModal").style.display = "none";
        }

        function submitRSVP(e) {
            e.preventDefault();
            const name = document.getElementById("guestName").value;
            alert(`Thank you, ${name}! Your RSVP response has been successfully recorded.`);
            closeRsvpModal();
        }

        /* 3. Add to Calendar Handler */
        function addToCalendar() {
            const title = encodeURIComponent("Griha Pravesh Ceremony");
            const details = encodeURIComponent("You are warmly invited to celebrate our Griha Pravesh Ceremony at our new home!");
            const location = encodeURIComponent("123 Anywhere St, Any City, ST 12345");
            const startTime = "20250728T023000Z"; // 8:00 AM IST approx in UTC
            const endTime = "20250728T063000Z";

            const googleCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startTime}/${endTime}&details=${details}&location=${location}`;
            window.open(googleCalUrl, '_blank');
        }

        /* 4. Canvas Floating Lotus Petals Particle Effect */
        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Petal {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 12 + 8;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.rotation = Math.random() * 360;
                this.rotSpeed = Math.random() * 1 - 0.5;
                this.color = Math.random() > 0.5 ? '#FF80AB' : '#F8BBD0';
                this.opacity = Math.random() * 0.6 + 0.3;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotSpeed;

                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;

                // Draw Lotus Petal Shape
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size / 2, -this.size, 0, -this.size * 1.3);
                ctx.bezierCurveTo(this.size / 2, -this.size, this.size / 2, -this.size / 2, 0, 0);
                ctx.fill();

                ctx.restore();
            }
        }

        const petals = Array.from({ length: 28 }, () => new Petal());

        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();
    </script>
</body>
</html>
