<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#210b2e">
	<title>Griha Pravesham</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700;900&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
	<style>
		:root {
			--maroon: #210b2e;
			--maroon-soft: #361139;
			--rani: #d92368;
			--orange: #f48c28;
			--teal: #0f958f;
			--blue: #234fa2;
			--emerald: #168257;
			--gold: #f8ca61;
			--gold-light: #fff0ad;
			--ink: #fff7da;
			--muted: #e5cba9;
			--shadow: rgba(8, 2, 14, .46);
		}

		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body {
			margin: 0;
			min-width: 320px;
			overflow-x: hidden;
			color: var(--ink);
			background: var(--maroon);
			font-family: "DM Sans", sans-serif;
		}
		button, a { font: inherit; }
		a { color: inherit; }

		.page { position: relative; isolation: isolate; }
		.page::before {
			content: "";
			position: fixed;
			z-index: -2;
			inset: 0;
			background: radial-gradient(circle at 50% 12%, #672042 0, transparent 34%), linear-gradient(145deg, #210b2e 15%, #3e102f 54%, #101e42 100%);
		}
		.page::after {
			content: "";
			position: fixed;
			z-index: -1;
			inset: 0;
			opacity: .14;
			background-image: radial-gradient(var(--gold) .7px, transparent .7px);
			background-size: 19px 19px;
			pointer-events: none;
		}
		.hero { position: relative; min-height: auto; padding: 12px 16px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; }
		.toran { width: min(100%, 620px); height: 75px; overflow: visible; }
		.toran path { fill: var(--orange); stroke: var(--gold); stroke-width: 1.5; }
		.toran .bead { fill: var(--teal); stroke: var(--gold); }
		.toran-group { transform-origin: center top; animation: sway 4s ease-in-out infinite; }
		.om-symbol {
			display: block;
			width: min(18vw, 138px);
			min-width: 82px;
			max-width: 138px;
			height: auto;
			aspect-ratio: 4 / 5;
			margin: 10px auto 8px;
			border-radius: 18px;
			object-fit: contain;
			filter: drop-shadow(0 3px 8px rgba(0, 0, 0, .3));
		}
		.eyebrow { margin: 0 0 12px; color: #f7a9bd; text-transform: uppercase; letter-spacing: .3em; font-size: 0.7rem; font-weight: 700; }
		.title-wrap { position: relative; display: grid; place-items: center; min-height: 220px; width: min(100%, 570px); }
		.mandala { position: absolute; width: min(92vw, 390px); opacity: .28; animation: spin 34s linear infinite; }
		.mandala circle, .mandala path { fill: none; stroke: var(--gold); stroke-width: 1.5; }
		.mandala .petal { fill: rgba(217, 35, 104, .3); }
		h1 { position: relative; margin: 0; max-width: 100%; color: var(--gold-light); background: linear-gradient(110deg, #d9942d 20%, #fff2a6 42%, #f8ca61 56%, #c57a1c 78%); background-size: 220% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font: 900 clamp(2.05rem, 10vw, 4.8rem)/1.08 "Cinzel Decorative", serif; text-shadow: 0 5px 22px rgba(0, 0, 0, .35); animation: shimmer 7s linear infinite; }
		.subtitle { position: relative; max-width: 560px; margin: 0 auto 22px; color: var(--muted); font: italic 500 clamp(1rem, 3.9vw, 1.3rem)/1.55 "Playfair Display", serif; }
		.hero-rule { display: flex; align-items: center; gap: 13px; width: min(100%, 340px); color: var(--gold); }
		.hero-rule::before, .hero-rule::after { content: ""; height: 1px; flex: 1; background: linear-gradient(to right, transparent, var(--gold)); }
		.hero-rule::after { background: linear-gradient(to left, transparent, var(--gold)); }

		.content { width: min(calc(100% - 32px), 820px); margin: 0 auto; padding-bottom: 42px; }
		.invitation { position: relative; overflow: hidden; padding: 33px 21px 27px; text-align: center; background: rgba(30, 7, 38, .58); border: 1px solid rgba(248, 202, 97, .64); box-shadow: 0 22px 60px var(--shadow), inset 0 0 0 7px rgba(248, 202, 97, .06); }
		.invitation::before, .invitation::after { content: ""; position: absolute; top: 9px; width: 36px; height: 36px; border-top: 2px solid var(--gold); }
		.invitation::before { left: 9px; border-left: 2px solid var(--gold); }
		.invitation::after { right: 9px; border-right: 2px solid var(--gold); }
		.invitation p { max-width: 670px; margin: 0 auto; color: #fbeac6; font: italic 500 clamp(1rem, 3.9vw, 1.3rem)/1.55 "Playfair Display", serif; }
		#invitationMessage { white-space: pre-line; }
		#hostDisplay { white-space: pre-line; font-size: 1.05rem; }
		.signature { margin-top: 22px !important; color: var(--gold-light) !important; font-style: italic; }
		.signature strong { display: block; margin-top: 7px; color: var(--ink); font: 500 clamp(1rem, 3.9vw, 1.3rem)/1.55 "Cinzel Decorative", serif; text-shadow: 0 5px 22px rgba(0, 0, 0, .35); animation: shimmer 7s linear infinite; }
		.details { display: grid; grid-template-columns: 1fr; margin: 28px 0 21px; border-top: 1px solid rgba(248, 202, 97, .55); border-bottom: 1px solid rgba(248, 202, 97, .55); }
		.detail-card { min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 19px 12px; text-align: center; opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
		.detail-card.visible { opacity: 1; transform: translateY(0); }
		.detail-card + .detail-card { border-top: 1px solid rgba(248, 202, 97, .22); }
		.detail-icon { display: block; margin-bottom: 6px; color: var(--gold); font-size: 1.55rem; }
		.detail-label { color: var(--gold); text-transform: uppercase; letter-spacing: .18em; font-size: .64rem; font-weight: 700; }
		.detail-value { margin-top: 6px; color: var(--ink); font: 500 1.04rem/1.45 "Playfair Display", serif; }
		.actions { display: grid; grid-template-columns: 1fr; justify-items: center; gap: 10px; margin: 23px 0 4px; }
		.action { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: fit-content; max-width: 100%; min-height: 48px; padding: 12px 17px; color: #2b1029; background: var(--gold); border: 1px solid var(--gold-light); border-radius: 3px; text-decoration: none; font-weight: 700; font-size: .86rem; box-shadow: 0 6px 18px rgba(0, 0, 0, .23); transition: transform .2s ease, background .2s ease; }
		.action:hover, .action:focus-visible { background: var(--gold-light); transform: translateY(-2px); }
		.action.alt { color: var(--ink); background: transparent; border-color: var(--teal); }
		.action.alt:hover, .action.alt:focus-visible { background: rgba(15, 149, 143, .25); }
		.rangoli { display: block; width: min(100%, 420px); max-width: 100%; height: auto; margin: 33px auto 0; overflow: visible; }
		.rangoli path, .rangoli circle { fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 4.5s ease-out .5s forwards; }
		.rangoli .fill { fill: var(--rani); stroke: var(--gold); }
		footer { padding: 0 20px 28px; text-align: center; color: #d6ad90; font-size: .72rem; letter-spacing: .1em; }
		#petals, #sparkles { position: fixed; z-index: 3; inset: 0; overflow: hidden; pointer-events: none; }
		.petal { position: absolute; top: -30px; width: 10px; height: 15px; border-radius: 70% 20% 70% 20%; opacity: .75; animation: fall linear infinite; }
		.spark { position: absolute; width: 7px; height: 7px; background: var(--gold-light); box-shadow: 0 0 12px var(--gold); animation: burst .8s ease-out forwards; }
		@keyframes sway { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
		@keyframes spin { to { transform: rotate(360deg); } }
		@keyframes shimmer { 0%, 45% { background-position: 200% center; } 75%, 100% { background-position: -20% center; } }
		@keyframes draw { to { stroke-dashoffset: 0; } }
		@keyframes fall { to { transform: translate3d(var(--drift), 110vh, 0) rotate(560deg); } }
		@keyframes burst { to { opacity: 0; transform: translate(var(--x), var(--y)) rotate(240deg) scale(.4); } }
		@media (min-width: 650px) { .hero { min-height: 76svh; padding: 20px 20px 36px; } .details { grid-template-columns: repeat(3, 1fr); } .detail-card + .detail-card { border-top: 0; border-left: 1px solid rgba(248, 202, 97, .22); } .actions { display: flex; flex-wrap: wrap; } .invitation { padding: 44px 48px 35px; } }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } .detail-card { opacity: 1; transform: none; } }
	</style>
</head>
<body>
	<div id="petals" aria-hidden="true"></div>
	<div id="sparkles" aria-hidden="true"></div>
	<main class="page">
		<section class="hero" aria-labelledby="titleLine">
			<svg class="toran" viewBox="0 0 600 100" role="img" aria-label="Marigold toran decoration">
				<g class="toran-group">
					<path d="M5 7 Q100 45 185 10 T365 10 T595 7" fill="none" stroke="#f8ca61" stroke-width="3"/>
					<path d="M34 17 Q50 52 65 18 Q82 55 98 27 Q115 59 131 27 Q150 59 168 21 Q184 58 200 18 Q218 61 236 21 Q254 59 272 18 Q290 60 308 20 Q327 57 345 18 Q364 59 382 18 Q399 58 418 25 Q436 59 453 20 Q470 56 488 20 Q507 58 524 24 Q542 54 558 17" fill="none" stroke="#f8ca61" stroke-width="3"/>
					<g class="bead"><circle cx="52" cy="27" r="8"/><circle cx="116" cy="35" r="8"/><circle cx="181" cy="28" r="8"/><circle cx="246" cy="34" r="8"/><circle cx="311" cy="29" r="8"/><circle cx="377" cy="32" r="8"/><circle cx="442" cy="28" r="8"/><circle cx="508" cy="31" r="8"/><circle cx="558" cy="25" r="8"/></g>
					<g><path d="M31 41 Q51 80 70 40 Q50 38 31 41"/><path d="M92 47 Q114 88 135 47 Q113 44 92 47"/><path d="M151 41 Q180 82 206 40 Q178 37 151 41"/><path d="M217 45 Q245 88 272 43 Q244 40 217 45"/><path d="M282 41 Q309 86 337 42 Q309 38 282 41"/><path d="M348 43 Q377 88 405 42 Q376 39 348 43"/><path d="M414 42 Q443 85 470 41 Q441 38 414 42"/><path d="M480 43 Q510 83 538 39 Q509 37 480 43"/></g>
				</g>
			</svg>
			<p class="eyebrow">|| ஸ்ரீ ஊத்துக்காடு எல்லை அம்மன் துணை ||</p>
			<!-- <img class="om-symbol" src="./Ganesha_img.jpg" alt="Ganesha image" /> -->
			<p class="eyebrow"></p>
            <br><br>
			<div class="title-wrap">
				<svg class="mandala" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="160"/><circle cx="200" cy="200" r="128"/><circle cx="200" cy="200" r="92"/><g class="petal"><path d="M200 200 C145 150 150 91 200 40 C250 91 255 150 200 200Z"/><path d="M200 200 C250 150 309 150 360 200 C309 250 250 250 200 200Z"/><path d="M200 200 C250 250 250 309 200 360 C150 309 150 250 200 200Z"/><path d="M200 200 C150 250 91 250 40 200 C91 150 150 150 200 200Z"/></g><path d="M200 29 L218 174 L339 79 L226 185 L371 200 L226 215 L339 321 L218 226 L200 371 L182 226 L61 321 L174 215 L29 200 L174 185 L61 79 L182 174Z"/><circle cx="200" cy="200" r="24"/></svg>
				<h1 id="titleLine">A New Beginning</h1>
			</div>
			<p class="subtitle">A home blessed with love is the greatest wealth.</p>
			<div class="hero-rule" aria-hidden="true">&#10022;</div>
		</section>

		<section class="content">
			<article class="invitation">
				<p id="invitationMessage"></p>
				<p class="signature"><span id="closingMessage"></span><strong id="hostDisplay"></strong></p>
			</article>

			<div class="details" aria-label="Event details">
				<article class="detail-card"><span class="detail-icon">&#128197;</span><span class="detail-label">Date &amp; day</span><span class="detail-value" id="dateDisplay">Sunday, 12 October 2026</span></article>
				<article class="detail-card"><span class="detail-icon">&#9200;</span><span class="detail-label">Muhurtham / time</span><span class="detail-value" id="timeDisplay">8:30 AM onwards</span></article>
				<article class="detail-card"><span class="detail-icon">&#128205;</span><span class="detail-label">Venue</span><span class="detail-value" id="addressDisplay">[Full address]</span></article>
			</div>
			<div class="actions">
				<a class="action" id="mapLink" href="[URL]" target="_blank" rel="noopener">&#128205; View Location</a>
				<a class="action alt" id="calendarLink" href="#" target="_blank" rel="noopener">&#128197; Add to Calendar</a>
			</div>
			<svg class="rangoli" viewBox="0 0 420 110" aria-hidden="true"><path d="M10 55 Q35 15 60 55 T110 55 T160 55 T210 55 T260 55 T310 55 T360 55 T410 55"/><path d="M90 55 Q120 20 150 55 Q120 90 90 55 M270 55 Q300 20 330 55 Q300 90 270 55"/><circle cx="210" cy="55" r="23"/><path class="fill" d="M210 37 Q230 55 210 73 Q190 55 210 37Z"/></svg>
		</section>
		<footer>May everyone be filled with peace, prosperity and joy.</footer>
	</main>

	<script>
		// Edit these values to personalise the invitation. Keep the date in YYYY-MM-DD format for calendar links.
		const eventDetails = {
			hosts: `Rishiyanth S 
					and 
					Family`,
			occasion: "Griha Pravesham",
			titleLine: "GRIHA PRAVESHAM",
			invitationMessage: `
                With the blessings of the Almighty,
                We are delighted to invite you to the Griha Pravesham of our new home. 
                Your gracious presence and blessings will make this occasion truly memorable.
            `,
			closingMessage: "With warm regards",
			address: "S2, Ganga Enclave, Kambar Street, Gandhi Nagar, Vadapalani - 600093",
			date: "2026-11-20",
			dateLabel: "Friday, 20 November 2026",
			time: "5:30 AM onwards",
			mapsUrl: "https://maps.app.goo.gl/TMD5trQdsiTikC3e6"
		};

		const byId = (id) => document.getElementById(id);
		byId("invitationMessage").textContent = eventDetails.invitationMessage;
		byId("closingMessage").textContent = eventDetails.closingMessage;
		byId("hostDisplay").textContent = eventDetails.hosts;
		byId("titleLine").textContent = eventDetails.titleLine;
		byId("dateDisplay").textContent = eventDetails.dateLabel;
		byId("timeDisplay").textContent = eventDetails.time;
		byId("addressDisplay").textContent = eventDetails.address;
		byId("mapLink").href = eventDetails.mapsUrl;
		document.title = `${eventDetails.occasion} - ${eventDetails.hosts.split("\n")[0].trim()}`;

		const calendarStart = `${eventDetails.date.replace(/-/g, "")}T083000`;
		const calendarEnd = `${eventDetails.date.replace(/-/g, "")}T123000`;
		const calendarParams = new URLSearchParams({ action: "TEMPLATE", text: `${eventDetails.occasion} - ${eventDetails.titleLine}`, dates: `${calendarStart}/${calendarEnd}`, details: `With warm regards, ${eventDetails.hosts}.`, location: eventDetails.address });
		byId("calendarLink").href = `https://calendar.google.com/calendar/render?${calendarParams}`;

		const observer = new IntersectionObserver((entries) => entries.forEach((entry) => { if (entry.isIntersecting) entry.target.classList.add("visible"); }), { threshold: .2 });
		document.querySelectorAll(".detail-card").forEach((card) => observer.observe(card));

		const petals = document.getElementById("petals");
		for (let index = 0; index < 18; index += 1) {
			const petal = document.createElement("i");
			petal.className = "petal";
			petal.style.left = `${Math.random() * 100}%`;
			petal.style.setProperty("--drift", `${(Math.random() - .5) * 180}px`);
			petal.style.animationDuration = `${7 + Math.random() * 8}s`;
			petal.style.animationDelay = `${Math.random() * -12}s`;
			petal.style.background = index % 2 ? "var(--rani)" : "var(--orange)";
			petals.appendChild(petal);
		}

		function burst(target) {
			const bounds = target.getBoundingClientRect();
			for (let index = 0; index < 20; index += 1) {
				const spark = document.createElement("i");
				spark.className = "spark";
				spark.style.left = `${bounds.left + bounds.width / 2}px`;
				spark.style.top = `${bounds.top + bounds.height / 2}px`;
				spark.style.setProperty("--x", `${(Math.random() - .5) * 230}px`);
				spark.style.setProperty("--y", `${(Math.random() - .5) * 170}px`);
				document.getElementById("sparkles").appendChild(spark);
				setTimeout(() => spark.remove(), 900);
			}
		}
		byId("titleLine").addEventListener("click", (event) => burst(event.currentTarget));
		byId("mapLink").addEventListener("click", (event) => burst(event.currentTarget));
	</script>
</body>
</html>
